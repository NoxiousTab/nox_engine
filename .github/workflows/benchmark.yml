name: Chess Engine Benchmark

# ================================================================
# DEFAULT BENCHMARK
#
# A normal push runs the default benchmark.
#
# You can also manually run the workflow from GitHub Actions and
# choose the opponent/Elo/time control from the UI.
# ================================================================

on:
  push:

  workflow_dispatch:
    inputs:
      opponent_name:
        description: "Opponent name"
        required: true
        default: "Stockfish-1700"

      opponent_elo:
        description: "Opponent Elo"
        required: true
        default: "1700"

      time_control:
        description: "CuteChess time control"
        required: true
        default: "1+1"

      rounds:
        description: "Number of rounds"
        required: true
        default: "10"

      games:
        description: "Games per round"
        required: true
        default: "2"


# ================================================================
# STATIC CONFIGURATION
# ================================================================

env:
  ENGINE_NAME: nox_engine

  STOCKFISH_VERSION: sf_19

  CONCURRENCY: "1"

  PGN_FILE: nox_vs_stockfish.pgn
  HISTORY_FILE: benchmarks/history.csv


# Allow GitHub Actions to commit benchmark history.
permissions:
  contents: write


jobs:

  benchmark:

    name: Nox Engine Benchmark

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # Resolve benchmark configuration
      #
      # Push:
      #   Uses the defaults below.
      #
      # Manual run:
      #   Uses values entered in GitHub Actions UI.
      # ==========================================================

      - name: Configure Benchmark
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "OPPONENT_NAME=${{ inputs.opponent_name }}" >> "$GITHUB_ENV"
            echo "OPPONENT_ELO=${{ inputs.opponent_elo }}" >> "$GITHUB_ENV"
            echo "TIME_CONTROL=${{ inputs.time_control }}" >> "$GITHUB_ENV"
            echo "ROUNDS=${{ inputs.rounds }}" >> "$GITHUB_ENV"
            echo "GAMES=${{ inputs.games }}" >> "$GITHUB_ENV"
          else
            echo "OPPONENT_NAME=Stockfish-1320" >> "$GITHUB_ENV"
            echo "OPPONENT_ELO=1320" >> "$GITHUB_ENV"
            echo "TIME_CONTROL=1+1" >> "$GITHUB_ENV"
            echo "ROUNDS=10" >> "$GITHUB_ENV"
            echo "GAMES=2" >> "$GITHUB_ENV"
          fi

      - name: Show Configuration
        run: |
          echo "========================================"
          echo "Benchmark Configuration"
          echo "========================================"
          echo "Engine:       ${ENGINE_NAME}"
          echo "Opponent:     ${OPPONENT_NAME}"
          echo "Opponent Elo: ${OPPONENT_ELO}"
          echo "Time Control: ${TIME_CONTROL}"
          echo "Rounds:       ${ROUNDS}"
          echo "Games/Round:  ${GAMES}"
          echo "Concurrency:  ${CONCURRENCY}"
          echo "========================================"


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            python3 \
            cutechess-cli


      # ==========================================================
      # Build Nox
      # ==========================================================

      - name: Build Nox Engine
        run: |
          chmod +x compile_engine.sh
          ./compile_engine.sh


      # ==========================================================
      # Verify Nox
      # ==========================================================

      - name: Verify Nox Engine
        run: |
          echo "========================================"
          echo "Engine"
          echo "========================================"

          ls -lh build/nox_engine
          file build/nox_engine

          echo
          echo "========================================"
          echo "Neural Network"
          echo "========================================"

          ls -lh neural_net/noxnet_baseline.nox

          echo
          echo "========================================"
          echo "UCI Test"
          echo "========================================"

          timeout 5s ./build/nox_engine <<EOF
          uci
          quit
          EOF


      # ==========================================================
      # Download Stockfish
      #
      # The workflow queries the official Stockfish GitHub release
      # instead of depending on a hard-coded binary filename.
      # ==========================================================

      - name: Download Stockfish
        run: |

          set -e

          API_URL="https://api.github.com/repos/official-stockfish/Stockfish/releases/tags/${STOCKFISH_VERSION}"

          echo "Fetching Stockfish ${STOCKFISH_VERSION}..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            -o stockfish_release.json


          python3 <<'PY'

          import json
          import sys

          with open("stockfish_release.json") as f:
              release = json.load(f)

          assets = release.get("assets", [])

          print("Available assets:")
          for asset in assets:
              print("  ", asset["name"])


          # Prefer Linux x64 universal binaries.
          candidates = [
              asset
              for asset in assets
              if "ubuntu" in asset["name"].lower()
              and "x64" in asset["name"].lower()
              and "universal" in asset["name"].lower()
              and asset["name"].endswith((".tar", ".tar.gz"))
          ]


          if not candidates:
              print()
              print("ERROR: Could not find a Linux x64 universal Stockfish binary.")
              sys.exit(1)


          asset = candidates[0]

          print()
          print("Selected asset:")
          print(asset["name"])


          with open("stockfish_url", "w") as f:
              f.write(asset["browser_download_url"])

          with open("stockfish_name", "w") as f:
              f.write(asset["name"])

          PY


          STOCKFISH_URL=$(cat stockfish_url)

          echo
          echo "Downloading Stockfish..."

          curl -fL \
            "$STOCKFISH_URL" \
            -o stockfish.tar


          mkdir -p stockfish_extract

          tar -xf stockfish.tar \
            -C stockfish_extract


          STOCKFISH_BIN=$(find stockfish_extract \
            -type f \
            -name "stockfish*" \
            -perm -111 \
            | head -n 1)


          if [ -z "$STOCKFISH_BIN" ]; then
            echo "ERROR: Stockfish executable not found."

            find stockfish_extract -type f -print

            exit 1
          fi


          cp "$STOCKFISH_BIN" ./stockfish

          chmod +x ./stockfish


          echo
          echo "Stockfish binary:"
          ls -lh ./stockfish


      # ==========================================================
      # Benchmark
      # ==========================================================

      - name: Run Benchmark
        run: |

          cutechess-cli \
            -engine \
              cmd=./build/nox_engine \
              name="${ENGINE_NAME}" \
              option.UseBook=false \
            -engine \
              cmd=./stockfish \
              name="${OPPONENT_NAME}" \
              option.UCI_LimitStrength=true \
              option.UCI_Elo="${OPPONENT_ELO}" \
            -each \
              proto=uci \
              tc="${TIME_CONTROL}" \
            -rounds "${ROUNDS}" \
            -games "${GAMES}" \
            -repeat \
            -concurrency "${CONCURRENCY}" \
            -recover \
            -pgnout "${PGN_FILE}"


      # ==========================================================
      # Calculate W/D/L
      # ==========================================================

      - name: Calculate Results
        id: results
        run: |

          python3 <<'PY'

          import re
          import os
          import sys

          pgn_file = os.environ["PGN_FILE"]

          engine = os.environ["ENGINE_NAME"]
          opponent = os.environ["OPPONENT_NAME"]
          elo = os.environ["OPPONENT_ELO"]


          try:
              with open(pgn_file, "r", encoding="utf-8") as f:
                  pgn = f.read()

          except FileNotFoundError:
              print("ERROR: PGN was not generated.")
              sys.exit(1)


          results = re.findall(
              r'^\[Result\s+"(1-0|0-1|1/2-1/2)"\]',
              pgn,
              re.MULTILINE
          )


          wins = 0
          draws = 0
          losses = 0


          for result in results:

              if result == "1-0":
                  wins += 1

              elif result == "0-1":
                  losses += 1

              else:
                  draws += 1


          total = wins + draws + losses


          if total == 0:
              print("ERROR: No game results found.")
              sys.exit(1)


          score = (wins + 0.5 * draws) / total * 100


          print()
          print("========================================")
          print("Benchmark Results")
          print("========================================")
          print(f"Engine:    {engine}")
          print(f"Opponent:  {opponent}")
          print(f"Elo:       {elo}")
          print(f"Games:     {total}")
          print(f"Wins:      {wins}")
          print(f"Draws:     {draws}")
          print(f"Losses:    {losses}")
          print(f"Score:     {score:.1f}%")
          print("========================================")


          with open(os.environ["GITHUB_OUTPUT"], "a") as f:

              f.write(f"wins={wins}\n")
              f.write(f"draws={draws}\n")
              f.write(f"losses={losses}\n")
              f.write(f"games={total}\n")
              f.write(f"score={score:.1f}\n")

          PY


      # ==========================================================
      # GitHub Actions Summary
      # ==========================================================

      - name: Add Benchmark Summary
        if: always()
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          # Chess Engine Benchmark

          ## Configuration

          | Setting | Value |
          |---|---|
          | Engine | \`${ENGINE_NAME}\` |
          | Opponent | \`${OPPONENT_NAME}\` |
          | Opponent Elo | ${OPPONENT_ELO} |
          | Time Control | ${TIME_CONTROL} |
          | Rounds | ${ROUNDS} |
          | Games/Round | ${GAMES} |
          | Total Games | ${{ steps.results.outputs.games }} |

          ## Result

          | Result | Games |
          |---|---:|
          | Wins | ${{ steps.results.outputs.wins }} |
          | Draws | ${{ steps.results.outputs.draws }} |
          | Losses | ${{ steps.results.outputs.losses }} |

          **Score: ${{ steps.results.outputs.score }}%**

          EOF


      # ==========================================================
      # Upload PGN
      # ==========================================================

      - name: Upload Tournament PGN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{
            env.ENGINE_NAME
          }}-vs-${{
            env.OPPONENT_NAME
          }}-${{
            github.sha
          }}

          path: ${{ env.PGN_FILE }}

          if-no-files-found: warn


      # ==========================================================
      # Update benchmark history
      # ==========================================================

      - name: Update Benchmark History
        if: success()
        run: |

          mkdir -p benchmarks


          if [ ! -f "${HISTORY_FILE}" ]; then

            echo "timestamp,commit,engine,opponent,opponent_elo,time_control,rounds,games_per_round,total_games,wins,draws,losses,score" \
              > "${HISTORY_FILE}"

          fi


          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),${GITHUB_SHA},${ENGINE_NAME},${OPPONENT_NAME},${OPPONENT_ELO},${TIME_CONTROL},${ROUNDS},${GAMES},${{ steps.results.outputs.games }},${{ steps.results.outputs.wins }},${{ steps.results.outputs.draws }},${{ steps.results.outputs.losses }},${{ steps.results.outputs.score }}" \
            >> "${HISTORY_FILE}"


          echo
          echo "========================================"
          echo "Recent Benchmark History"
          echo "========================================"

          tail -n 10 "${HISTORY_FILE}"


      # ==========================================================
      # Commit history
      # ==========================================================

      - name: Commit Benchmark History
        if: success()
        run: |

          git config user.name "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add "${HISTORY_FILE}"


          if git diff --cached --quiet; then

            echo "No history changes."

            exit 0

          fi


          git commit \
            -m "ci: record benchmark result [skip ci]"


          git push


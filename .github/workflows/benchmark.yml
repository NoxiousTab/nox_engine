name: Chess Engine Benchmark

on:
  push:
  workflow_dispatch:
    inputs:
      opponent_name:
        description: "Opponent name"
        required: true
        default: "Stockfish-1700"

      opponent_elo:
        description: "Opponent Elo"
        required: true
        default: "1700"

      time_control:
        description: "Time control"
        required: true
        default: "1+1"

      rounds:
        description: "Number of rounds"
        required: true
        default: "50"

      games:
        description: "Games per round"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  benchmark:
    name: Chess Engine Benchmark
    runs-on: ubuntu-latest

    env:
      ENGINE_NAME: nox_engine
      STOCKFISH_VERSION: sf_19
      CONCURRENCY: "1"
      PGN_FILE: nox_vs_stockfish.pgn
      HISTORY_FILE: benchmarks/history.csv

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Configuration
      # ------------------------------------------------------------

      - name: Set benchmark configuration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "OPPONENT_NAME=${{ inputs.opponent_name }}" >> "$GITHUB_ENV"
            echo "OPPONENT_ELO=${{ inputs.opponent_elo }}" >> "$GITHUB_ENV"
            echo "TIME_CONTROL=${{ inputs.time_control }}" >> "$GITHUB_ENV"
            echo "ROUNDS=${{ inputs.rounds }}" >> "$GITHUB_ENV"
            echo "GAMES=${{ inputs.games }}" >> "$GITHUB_ENV"
          else
            echo "OPPONENT_NAME=Stockfish-1320" >> "$GITHUB_ENV"
            echo "OPPONENT_ELO=1320" >> "$GITHUB_ENV"
            echo "TIME_CONTROL=1+1" >> "$GITHUB_ENV"
            echo "ROUNDS=10" >> "$GITHUB_ENV"
            echo "GAMES=2" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            python3 \
            python3-pip \
            wget \
            tar

      # ------------------------------------------------------------
      # Build Nox
      # ------------------------------------------------------------

      - name: Build Nox engine
        run: |
          chmod +x compile_engine.sh
          ./compile_engine.sh

      - name: Verify Nox engine
        run: |
          set -e

          test -x build/nox_engine
          test -f neural_net/noxnet_baseline.nox

          echo "Nox executable:"
          ls -lh build/nox_engine

          echo
          echo "Neural network:"
          ls -lh neural_net/noxnet_baseline.nox

          echo
          echo "Testing UCI..."

          timeout 10s ./build/nox_engine <<EOF
          uci
          quit
          EOF

      # ------------------------------------------------------------
      # Install Cute Chess
      # ------------------------------------------------------------

      - name: Install Cute Chess CLI
        run: |
          set -e

          echo "Downloading Cute Chess v1.5.1..."

          curl -fL \
            "https://github.com/cutechess/cutechess/archive/refs/tags/v1.5.1.tar.gz" \
            -o cutechess.tar.gz

          mkdir -p cutechess
          tar -xzf cutechess.tar.gz -C cutechess --strip-components=1

          echo "Installing build dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-5compat-dev

          echo "Configuring Cute Chess..."

          cmake -S cutechess -B cutechess/build \
            -DWITH_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

          echo "Building cutechess-cli only..."

          cmake --build cutechess/build \
            --target cli \
            --parallel 2

          echo "Locating cutechess-cli..."

          CUTECHESS_BIN="cutechess/build/cutechess-cli"

          if [ ! -f "$CUTECHESS_BIN" ]; then
            echo "ERROR: cutechess-cli was not built."
            find cutechess/build -type f -name '*cutechess*' -print
            exit 1
          fi

          cp "$CUTECHESS_BIN" ./cutechess-cli
          chmod +x ./cutechess-cli

          echo "Cute Chess version:"
          ./cutechess-cli --version

      # ------------------------------------------------------------
      # Download Stockfish
      # ------------------------------------------------------------

      - name: Download Stockfish
        run: |
          set -e

          echo "Downloading Stockfish ${STOCKFISH_VERSION}..."

          curl -fsSL \
            "https://api.github.com/repos/official-stockfish/Stockfish/releases/tags/${STOCKFISH_VERSION}" \
            -o stockfish_release.json

          python3 <<'PY'
          import json
          import sys

          with open("stockfish_release.json") as f:
              release = json.load(f)

          assets = release.get("assets", [])

          print("Available Stockfish assets:")
          for asset in assets:
              print("  " + asset["name"])

          candidates = []

          for asset in assets:
              name = asset["name"].lower()

              if (
                  "ubuntu" in name
                  and "x86-64" in name
                  and "avx2" in name
                  and name.endswith((".tar", ".tar.gz"))
              ):
                  candidates.append(asset)

          # Fall back to any Ubuntu x86-64 binary if AVX2 isn't found.
          if not candidates:
              for asset in assets:
                  name = asset["name"].lower()

                  if (
                      "ubuntu" in name
                      and "x86-64" in name
                      and name.endswith((".tar", ".tar.gz"))
                  ):
                      candidates.append(asset)

          if not candidates:
              print()
              print("ERROR: Could not find a compatible Stockfish binary.")
              sys.exit(1)

          asset = candidates[0]

          print()
          print("Selected Stockfish asset:")
          print(asset["name"])

          with open("stockfish_url", "w") as f:
              f.write(asset["browser_download_url"])
          PY

          curl -fL \
            "$(cat stockfish_url)" \
            -o stockfish.tar

          mkdir -p stockfish_extract

          tar -xf stockfish.tar \
            -C stockfish_extract

          echo
          echo "Extracted Stockfish files:"
          find stockfish_extract -type f -print

          STOCKFISH_BIN=$(find stockfish_extract \
            -type f \
            -name "stockfish*" \
            -perm -111 \
            | head -n 1)

          if [ -z "$STOCKFISH_BIN" ]; then
            echo
            echo "ERROR: Stockfish executable not found."
            exit 1
          fi

          cp "$STOCKFISH_BIN" ./stockfish
          chmod +x ./stockfish

          echo
          echo "Stockfish executable:"
          ls -lh ./stockfish

          echo
          echo "Testing Stockfish..."

          timeout 10s ./stockfish <<EOF
          uci
          quit
          EOF

      # ------------------------------------------------------------
      # Benchmark
      # ------------------------------------------------------------

      - name: Run benchmark
        run: |
          set -e

          echo "========================================"
          echo "Chess Engine Benchmark"
          echo "========================================"
          echo "Engine:       ${ENGINE_NAME}"
          echo "Opponent:     ${OPPONENT_NAME}"
          echo "Opponent Elo: ${OPPONENT_ELO}"
          echo "Time control: ${TIME_CONTROL}"
          echo "Rounds:       ${ROUNDS}"
          echo "Games/round:  ${GAMES}"
          echo "Concurrency:  ${CONCURRENCY}"
          echo "========================================"

          ./cutechess-cli \
            -engine \
              cmd=./build/nox_engine \
              name="${ENGINE_NAME}" \
              option.UseBook=false \
            -engine \
              cmd=./stockfish \
              name="${OPPONENT_NAME}" \
              option.UCI_LimitStrength=true \
              option.UCI_Elo="${OPPONENT_ELO}" \
            -each \
              proto=uci \
              tc="${TIME_CONTROL}" \
            -rounds "${ROUNDS}" \
            -games "${GAMES}" \
            -repeat \
            -concurrency "${CONCURRENCY}" \
            -recover \
            -pgnout "${PGN_FILE}"

      # ------------------------------------------------------------
      # Calculate W/D/L
      # ------------------------------------------------------------

      - name: Calculate benchmark results
        id: results
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          pgn_file = os.environ["PGN_FILE"]

          if not os.path.isfile(pgn_file):
              print("ERROR: PGN file was not created.")
              sys.exit(1)

          with open(pgn_file, encoding="utf-8") as f:
              pgn = f.read()

          results = re.findall(
              r'^\[Result\s+"(1-0|0-1|1/2-1/2)"\]',
              pgn,
              re.MULTILINE
          )

          wins = results.count("1-0")
          losses = results.count("0-1")
          draws = results.count("1/2-1/2")

          total = wins + draws + losses

          if total == 0:
              print("ERROR: No game results found in PGN.")
              sys.exit(1)

          score = (wins + draws * 0.5) / total * 100

          print()
          print("========================================")
          print("Benchmark Result")
          print("========================================")
          print(f"Wins:   {wins}")
          print(f"Draws:  {draws}")
          print(f"Losses: {losses}")
          print(f"Games:  {total}")
          print(f"Score:  {score:.1f}%")
          print("========================================")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"wins={wins}\n")
              f.write(f"draws={draws}\n")
              f.write(f"losses={losses}\n")
              f.write(f"games={total}\n")
              f.write(f"score={score:.1f}\n")
          PY

      # ------------------------------------------------------------
      # GitHub Actions summary
      # ------------------------------------------------------------

      - name: Add benchmark summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Chess Engine Benchmark

          | Setting | Value |
          |---|---|
          | Engine | ${ENGINE_NAME} |
          | Opponent | ${OPPONENT_NAME} |
          | Opponent Elo | ${OPPONENT_ELO} |
          | Time Control | ${TIME_CONTROL} |
          | Rounds | ${ROUNDS} |
          | Games/Round | ${GAMES} |
          | Total Games | ${{ steps.results.outputs.games }} |

          ## Result

          | Result | Games |
          |---|---:|
          | Wins | ${{ steps.results.outputs.wins }} |
          | Draws | ${{ steps.results.outputs.draws }} |
          | Losses | ${{ steps.results.outputs.losses }} |

          **Score: ${{ steps.results.outputs.score }}%**
          EOF

      # ------------------------------------------------------------
      # Upload PGN
      # ------------------------------------------------------------

      - name: Upload PGN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-benchmark-${{ github.sha }}
          path: ${{ env.PGN_FILE }}
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Persistent history
      # ------------------------------------------------------------

      - name: Update benchmark history
        if: success()
        run: |
          mkdir -p benchmarks

          if [ ! -f "${HISTORY_FILE}" ]; then
            echo "timestamp,commit,engine,opponent,opponent_elo,time_control,rounds,games_per_round,total_games,wins,draws,losses,score" \
              > "${HISTORY_FILE}"
          fi

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),${GITHUB_SHA},${ENGINE_NAME},${OPPONENT_NAME},${OPPONENT_ELO},${TIME_CONTROL},${ROUNDS},${GAMES},${{ steps.results.outputs.games }},${{ steps.results.outputs.wins }},${{ steps.results.outputs.draws }},${{ steps.results.outputs.losses }},${{ steps.results.outputs.score }}" \
            >> "${HISTORY_FILE}"

          echo
          echo "Recent benchmark history:"
          tail -n 10 "${HISTORY_FILE}"

      # ------------------------------------------------------------
      # Commit history
      # ------------------------------------------------------------

      - name: Commit benchmark history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${HISTORY_FILE}"

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "ci: record benchmark result [skip ci]"
          git push

